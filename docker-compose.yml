# Backing services for local development: PostgreSQL 15 and Redis 7.
#
#   docker-compose up -d postgres redis
#
# Earlier revisions of this file also declared `server` and `client` services built
# from docker/server/Dockerfile and docker/client/Dockerfile. That directory does not
# exist, so `docker-compose up` failed at the build step before anything started.
# Those definitions were removed rather than left as a trap; application container
# images are tracked as open work (DEV-12). Run the app locally with:
#
#   cd server && npm install && npm run dev
#   cd client && npm install && npm run dev:mock   # or `npm run dev` for the real API
#
# The credentials below are for a disposable local database only.

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: securebank-db
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securebank-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
