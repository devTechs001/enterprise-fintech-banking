<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Identity: the previous file shipped Vite's default mark on a banking app. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <title>SecureBank — Enterprise Banking</title>
    <meta name="description" content="Secure enterprise banking: accounts, transfers, cards, investments and loans, with two-factor authentication and full session control." />
    <meta name="application-name" content="SecureBank" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SecureBank" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Never let a search engine index a demo banking client, and never let a
         browser guess at a MIME type. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <style>
      /* Pre-JavaScript splash.
         Painted before a single byte of the bundle arrives, so a cold load never
         shows a blank white page. React removes it once the session has been
         resolved; see src/app/SessionGate.jsx. Inlined rather than linked because
         a stylesheet request would delay the very thing this exists to prevent. */
      html, body { margin: 0; padding: 0; background: #0b1020; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: radial-gradient(120% 120% at 50% 0%, #131a33 0%, #0b1020 60%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        transition: opacity .28s ease; padding: 24px;
      }
      #splash.is-hidden { opacity: 0; pointer-events: none; }
      #splash .mark {
        width: 64px; height: 64px; border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
        box-shadow: 0 12px 32px rgba(30, 64, 175, .45);
      }
      #splash .mark svg { width: 38px; height: 38px; }
      #splash .name { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; color: #fff; }
      #splash .label { margin: 4px 0 0; font-size: 13px; color: #94a3b8; text-align: center; }
      #splash .bar { width: 176px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; }
      #splash .bar i { display: block; width: 34%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #60a5fa, #a78bfa); animation: splash 1.1s ease-in-out infinite; }
      @keyframes splash { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
      /* Respect the user's motion preference rather than animating regardless. */
      @media (prefers-reduced-motion: reduce) {
        #splash .bar i { animation: none; width: 100%; opacity: .55; }
        #splash { transition: none; }
      }
      @media (prefers-color-scheme: light) {
        html, body { background: #ffffff; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" role="status" aria-live="polite">
      <span class="mark">
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M32 11l15 5v13c0 10-6.4 17.6-15 21-8.6-3.4-15-11-15-21V16l15-5z"
                fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" opacity=".92"/>
          <path d="M38 26.5c0-2.6-2.7-4.3-6-4.3s-6 1.7-6 4.2c0 5.4 12 2.7 12 8.1 0 2.6-2.7 4.4-6 4.4s-6-1.8-6-4.4"
                fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
      </span>
      <div>
        <p class="name">SecureBank</p>
        <p class="label">Loading your workspace…</p>
      </div>
      <div class="bar"><i></i></div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
